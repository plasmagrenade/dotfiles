$IF_DISCHARGING = ~/.config/hypr/scripts/if_discharging.sh
$IF_CHARGING    = ~/.config/hypr/scripts/if_charging.sh

general {
    lock_cmd         = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd  = sleep 1 && omarchy-system-wake
    inhibit_sleep    = 3
}

# Battery: dim at 3min, lock at 5min, screen off at 5.5min, suspend at 10min

listener {
    timeout    = 180
    on-timeout = $IF_DISCHARGING "brightnessctl -s && brightnessctl s 30%"
    on-resume  = brightnessctl -r
}

listener {
    timeout    = 300
    on-timeout = $IF_DISCHARGING omarchy-system-lock
}

listener {
    timeout    = 330
    on-timeout = $IF_DISCHARGING hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout    = 600
    on-timeout = $IF_DISCHARGING systemctl suspend
}

# AC: dim at 14min, lock at 15min, screen off at 15.5min

listener {
    timeout    = 840
    on-timeout = $IF_CHARGING "brightnessctl -s && brightnessctl s 30%"
    on-resume  = brightnessctl -r
}

listener {
    timeout    = 900
    on-timeout = $IF_CHARGING omarchy-system-lock
}

listener {
    timeout    = 930
    on-timeout = $IF_CHARGING hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
