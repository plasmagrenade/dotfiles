source = ~/.config/omarchy/current/theme/hyprlock.conf
 
general {
    ignore_empty_input = true
}

background {
  monitor =
  color = $color
# path = ~/.config/omarchy/current/background
# blur_passes = 3
}

animations {
    enabled = false
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message =
    fingerprint:present_message = ...
}

input-field {
    monitor =
    size = 300, 40
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(0, 0, 0, 1.0)
    outer_color = rgba(80, 80, 80, 0.6)

    font_family = CaskaydiaMono Nerd Font
#font_color = $font_color

    font_color = rgba(255, 255, 255, 1.0)
    # placeholder_text = <span> Enter Password 󰈷 </span>
    placeholder_text =
#check_color = $check_color
    check_color = rgba(80, 80, 80, 0.6)
    fail_color = rgba(255, 255, 255, 1.0)
    fail_text = <i>LIFTOACH ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false

    outline_thickness = 1
    dots_center = false
    dots_size = 0
    dots_spacing = 0
    hide_input = true
}

label {
    monitor =
    text = cmd[update:0] uv run ~/.local/bin/lockscreen.py
    font_size = 12
    position = 0, 50
    halign = center
    valign = center

    font_family = CaskaydiaMono Nerd Font
    color = $font_color
}

label {
    monitor =
    text = $FPRINTPROMPT
    font_size = 12
    position = 0, -50
    halign = center
    valign = center

    font_family = CaskaydiaMono Nerd Font
    color = rgba(180, 180, 180, 1.0)
}

